server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Detrás de Traefik (Dokploy): redirecciones relativas, sin puerto interno.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json
               application/xml image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # El sitio usa trailing slash; nginx añade la barra a las carpetas con 301.
    location = /sitemap.xml {
        return 301 /sitemap-index.xml;
    }

    # Archivos con hash en el nombre: cache de un año.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /__astro_font_generated__/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Imágenes: el nombre no cambia al editarlas, así que cache corto.
    location ~* \.(?:webp|jpg|jpeg|png|svg|ico|woff2|mp4)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
